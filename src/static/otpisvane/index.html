<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Отписване — Pixel Lab</title>
<style>
  /* Source: C:\Pixel Lab Claude\24 Otpisvane\stranica.html (one template for sortis.pro and pixellabsoft.com) */
  :root { --bg: #f6f5f2; --card: #fff; --text: #1d1d1f; --muted: #6b6b70; --line: #e4e2dc; --accent: #2152ff; --ok: #1f8a4c; }
  @media (prefers-color-scheme: dark) { :root { --bg: #141416; --card: #1d1d20; --text: #f2f2f2; --muted: #a0a0a8; --line: #2c2c31; --ok: #3ccf7b; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .card { width: 100%; max-width: 440px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 32px 28px; text-align: center; }
  .brand { font-weight: 800; letter-spacing: .02em; font-size: 20px; margin-bottom: 18px; }
  .brand span { color: var(--accent); }
  h1 { font-size: 22px; margin: 0 0 10px; }
  p { color: var(--muted); margin: 0 0 22px; }
  button { width: 100%; border: 0; border-radius: 12px; padding: 15px; font: inherit; font-weight: 700; font-size: 17px; cursor: pointer;
    background: var(--accent); color: #fff; }
  button:disabled { opacity: .6; cursor: default; }
  .done h1 { color: var(--ok); }
  .err { color: #d33; margin: 14px 0 0; font-size: 14px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main class="card">
  <div class="brand">Pixel <span>Lab</span></div>
  <section id="ask">
    <h1>Не искате повече писма от нас?</h1>
    <p>Натиснете бутона и няма да Ви пишем повече.</p>
    <button id="go">Отпиши ме</button>
    <div class="err" id="err" hidden></div>
  </section>
  <section id="done" class="done" hidden>
    <h1>Готово ✓</h1>
    <p>Няма да получавате повече писма от нас. Извинете за безпокойството.</p>
  </section>
  <section id="bad" hidden>
    <h1>Линкът не е пълен</h1>
    <p>Отворете го направо от писмото или ни отговорете с „не“ — и ще Ви отпишем.</p>
  </section>
</main>
<script>
  // The token (from the letter's link, after #) is an opaque code — no e-mail in the address or in the database.
  const t = location.hash.slice(1).toLowerCase();
  const url = 'https://firestore.googleapis.com/v1/projects/pixellab-otpisvane/databases/(default)/documents/otpisani'
    + '?documentId=' + t + '&key=AIzaSyANpoMUAWnoqI4jUti4_lyb_0cDLPKazWI';
  const $ = (id) => document.getElementById(id);
  if (!/^[0-9a-f]{20}$/.test(t)) { $('ask').hidden = true; $('bad').hidden = false; }
  $('go').addEventListener('click', async () => {
    $('go').disabled = true; $('err').hidden = true;
    try {
      const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fields: { at: { timestampValue: new Date().toISOString() }, kak: { stringValue: 'buton' } } }) });
      if (!r.ok && r.status !== 409) throw new Error('HTTP ' + r.status);   // 409: already unsubscribed — fine
      $('ask').hidden = true; $('done').hidden = false;
    } catch (e) {
      console.error('Unsubscribe failed', e);
      $('go').disabled = false;
      $('err').textContent = 'Не се получи. Опитайте пак или ни отговорете с „не“ на писмото.';
      $('err').hidden = false;
    }
  });
</script>
</body>
</html>
